<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="698" viewBox="0 0 1080 698" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">Aimake 产品战略：从一条科技新闻，到下一期</title>
  <desc id="desc">先用真实来源核对事实，制作可编辑的社媒原稿，再交付能重开的公众号草稿，由作者发布。将来源、模板和改稿经验留给下一期。扩展渠道前观察首次成品用时、草稿重开成功率和七天内完成第二期的人数。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#38685b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #183930; }
      .kicker { font-size: 16px; font-weight: 600; fill: #356356; letter-spacing: 1px; }
      .title { font-size: 43px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #415f54; }
      .stage { font-size: 16px; font-weight: 600; fill: #356356; }
      .card-title { font-size: 27px; font-weight: 650; }
      .body { font-size: 19px; fill: #38564c; }
      .caption { font-size: 16px; fill: #50685e; }
      .metric { font-size: 23px; font-weight: 650; fill: #fffdf7; }
      .metric-caption { font-size: 17px; fill: #ddede3; }
      .line { stroke: #38685b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1080" height="698" rx="18" fill="#f8f8f1"/>
  <g aria-label="战略方向">
    <rect x="44" y="38" width="28" height="5" rx="2.5" fill="#d17945"/>
    <text class="kicker" x="83" y="47">AIMAKE  /  产品战略</text>
    <text class="caption" x="1036" y="47" text-anchor="end">试点提案 · 2026.11</text>
    <text class="title" x="44" y="113">从一条科技新闻，到下一期</text>
    <text class="subtitle" x="46" y="156">服务持续更新的科技作者，让每期的来源、成品和编辑经验都能复用。</text>
  </g>
  <g aria-label="创作者的一次交付">
    <rect x="44" y="201" width="302" height="180" rx="14" fill="#e6eee5"/>
    <text class="stage" x="65" y="235">采集与核对</text>
    <text class="card-title" x="65" y="278">选一条真实新闻</text>
    <text class="body" x="65" y="322">订阅或贴链接，找到原文</text>
    <text class="body" x="65" y="351">把数字、日期连回出处</text>
    <path class="line" d="M351 291 H381" marker-end="url(#arrow)"/>

    <rect x="389" y="201" width="302" height="180" rx="14" fill="#e1eee9"/>
    <text class="stage" x="410" y="235">创作与编排</text>
    <text class="card-title" x="410" y="278">改好一份社交稿</text>
    <text class="body" x="410" y="322">作者选角度、换图、改标题</text>
    <text class="body" x="410" y="351">输出公众号富文本与竖版图组</text>
    <path class="line" d="M696 291 H726" marker-end="url(#arrow)"/>

    <rect x="734" y="201" width="302" height="180" rx="14" fill="#f4e5d3"/>
    <text class="stage" x="755" y="235" style="fill:#89522e">平台交付 · 先验公众号</text>
    <text class="card-title" x="755" y="278">重开同一篇草稿</text>
    <text class="body" x="755" y="322">按账号与标题找到已存草稿</text>
    <text class="body" x="755" y="351">检查图文，由作者点击发布</text>
  </g>
  <g aria-label="创作经验回流">
    <path class="line" d="M885 389 V412 Q885 426 871 426 H209 Q195 426 195 412 V390" marker-end="url(#arrow)"/>
    <rect x="337" y="405" width="406" height="41" rx="20" fill="#f8f8f1"/>
    <text class="body" x="540" y="433" text-anchor="middle">把来源、版式与人工修改带入下一期</text>
  </g>
  <g aria-label="扩平台的判断依据">
    <rect x="44" y="481" width="992" height="169" rx="14" fill="#184538"/>
    <text x="68" y="519" style="fill:#c0dbca;font-size:17px;font-weight:600">何时值得扩到知乎、掘金？</text>
    <path d="M68 537 H1012" stroke="#4d7364"/>
    <path d="M373 555 V625 M700 555 V625" stroke="#4d7364"/>
    <text class="metric" x="68" y="578">首份成品用时</text>
    <text class="metric-caption" x="68" y="613">从放入原文到作者愿意使用</text>
    <text class="metric" x="395" y="578">草稿重开成功率</text>
    <text class="metric-caption" x="395" y="613">同一账号、同一篇、图文齐全</text>
    <text class="metric" x="722" y="578">七天内做第二期的人数</text>
    <text class="metric-caption" x="722" y="613">用新选题观察真实复用</text>
  </g>
</svg>
