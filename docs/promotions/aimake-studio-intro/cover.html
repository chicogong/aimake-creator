<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Aimake Studio cover</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .stage {
      width: 1920px;
      height: 1080px;
      background: var(--am-page);
      position: relative;
      overflow: hidden;
    }
    .blob-lavender {
      position: absolute;
      width: 980px;
      height: 980px;
      left: -140px;
      top: -220px;
      border-radius: 50%;
      background: var(--am-blob-lavender);
    }
    .blob-cream {
      position: absolute;
      width: 760px;
      height: 760px;
      right: -180px;
      bottom: -260px;
      border-radius: 50%;
      background: var(--am-blob-cream);
    }
    .copy {
      position: absolute;
      left: 128px;
      top: 50%;
      transform: translateY(-52%);
      width: 920px;
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .kicker img {
      width: 52px;
      height: 52px;
    }
    .kicker span {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--am-ink);
      line-height: 1;
    }
    h1 {
      margin: 40px 0 0;
      font-size: 128px;
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.055em;
      color: var(--am-ink);
    }
    .sub {
      margin: 32px 0 0;
      max-width: 820px;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: -0.01em;
      color: var(--am-muted);
    }
    .symbol {
      position: absolute;
      right: 128px;
      top: 50%;
      transform: translateY(-50%);
      width: 500px;
      height: 500px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="blob-lavender"></div>
    <div class="blob-cream"></div>
    <div class="copy">
      <div class="kicker">
        <img src="../../../assets/brand/logos/symbol-color.svg" alt="">
        <span>Aimake Studio 爱创工坊</span>
      </div>
      <h1>从写稿到出片</h1>
      <p class="sub">一份原稿，在本地导出图卡、PPTX、PDF 和视频</p>
    </div>
    <img class="symbol" src="../../../assets/brand/logos/symbol-color.svg" alt="">
  </div>
</body>
</html>
