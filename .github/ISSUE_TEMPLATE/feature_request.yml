name: 💡 Feature Request / Proposal
description: Propose a new capability, export format, CLI workflow, or AI Co-Pilot integration
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love community ideas! Aimake is built around the "Research → Grounded Wiki → Compose → Omni-Channel Deliver" creative flywheel.

  - type: dropdown
    id: area
    attributes:
      label: Target Subsystem / Area
      description: Which area does this feature enhance?
      options:
        - "area: intake (Material ingestion, scrapers, data sources)"
        - "area: distill (Wiki, persona, knowledge extraction)"
        - "area: create (Composer, Calm Studio canvas, live preview)"
        - "area: publish (Omni-channel exporters, social platforms)"
        - "area: video (Video synthesis, FFmpeg loudness, CapCut drafts)"
        - "area: templates (New design systems, aspect ratios)"
        - "area: mcp (Model Context Protocol, agent tools)"
        - "area: desktop (macOS native desktop experience)"
        - "area: site (Official aimake.cc site & live web playground)"
        - "area: security (Loopback CSRF guard, secret & privacy auditing)"
        - "area: ci-cd (GitHub Actions, workflows, automation)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear description of the friction, workflow limitation, or missing capability.
      placeholder: "I'm always frustrated when I need to convert my research tables into..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & User Experience
      description: How should this work in the CLI, Calm Studio, or MCP server?
      placeholder: "Add support for CSV/Excel table auto-intake into Bento metrics tiles..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches or existing tools you've evaluated?
