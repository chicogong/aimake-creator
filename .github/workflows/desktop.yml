name: Build & Release macOS Desktop Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG & App Bundle
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web & CLI artifacts
        run: pnpm build

      - name: Build macOS Native App and DMG Installer
        run: node scripts/build-macos-dmg.mjs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aimake-macos-installer
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip

      - name: Attach Installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
