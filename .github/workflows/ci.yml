name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static typecheck
        run: pnpm typecheck

      - name: Production bundle build
        run: pnpm build

      - name: Vitest test suites
        run: pnpm test

      - name: Fast Smoke Test Preflight
        run: pnpm test:smoke

      - name: Skill & Template contract audit
        run: pnpm validate:skill && pnpm audit:skills

      - name: Secrets & Leak prevention audit
        run: pnpm audit:secrets

      - name: NPM publication tarball check
        run: pnpm pack:check

      - name: Build Official Static Website
        run: pnpm site:build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E test suites
        run: pnpm test:e2e
